[project]
name = "flux-topology"
version = "0.2.0"
description = "Static dependency/topology graph of a FluxCD GitOps repo, exposed to AI agents over MCP"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Daveri" }]
keywords = ["fluxcd", "gitops", "kubernetes", "mcp", "topology", "dependency-graph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "mcp>=1.2.0",
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/daveri/flux-topology-mcp"
Repository = "https://github.com/daveri/flux-topology-mcp"
Issues = "https://github.com/daveri/flux-topology-mcp/issues"

[project.scripts]
flux-topology = "flux_topology.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flux_topology"]

[tool.pytest.ini_options]
testpaths = ["tests"]
